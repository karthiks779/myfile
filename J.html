
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puter AI Chat</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:20px auto;
    padding:15px;
}

textarea{
    width:100%;
    height:120px;
    padding:10px;
}

button{
    margin-top:10px;
    padding:10px 20px;
    cursor:pointer;
}

#output{
    margin-top:20px;
    border:1px solid #ccc;
    padding:10px;
    min-height:150px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>Puter AI Chat</h2>

<textarea id="prompt" placeholder="Type your message..."></textarea>
<br>
<button onclick="sendMessage()">Send</button>

<div id="output"></div>

<script src="https://js.puter.com/v2/"></script>

<script>
async function sendMessage() {

    const prompt =
        document.getElementById("prompt").value.trim();

    const output =
        document.getElementById("output");

    if (!prompt) return;

    output.textContent = "Thinking...\n";

    try {

        const response = await puter.ai.chat(
            prompt,
            {
                stream: true,
                model: "gpt-5.4-nano"
            }
        );

        output.textContent = "";

        for await (const part of response) {
            output.textContent += part?.text || "";
        }

    } catch (err) {

        output.textContent =
            "Error: " + err.message;
    }
}
</script>

</body>
</html>
