<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puter AI + TTS Pro + Canvas</title>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:Arial,sans-serif; overflow:hidden; background:#000; color:#fff; }
#bg{ position:fixed; inset:0; }
.panel{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:95%; max-width:1000px; max-height:95vh; overflow:auto;
  padding:20px; border-radius:20px; background:rgba(255,255,255,.12);
  backdrop-filter:blur(12px);
}
h2{ margin-bottom:12px; }
textarea{ width:100%; min-height:120px; padding:12px; border:none; border-radius:10px; resize:vertical; background:rgba(0,0,0,0.12); color:#fff; }
#output{ margin-top:12px; padding:12px; min-height:120px; border-radius:10px; background:rgba(255,255,255,.06); white-space:pre-wrap; color:#fff; }
.controls{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; align-items:center; }
button{ padding:10px 15px; border:none; border-radius:8px; cursor:pointer; background:rgba(255,255,255,0.08); color:#fff; }
input[type=number]{ width:80px; padding:5px; border-radius:6px; border:none; background:rgba(255,255,255,0.04); color:#fff; }
label{ display:flex; align-items:center; gap:8px; color:#fff; }
.small{ font-size:13px; color:#ddd; margin-left:8px; }
#chat-window{ background:rgba(0,0,0,0.12); padding:10px; border-radius:8px; max-height:220px; overflow:auto; color:#fff; font-size:14px; }
.msg.user{ color:#a8e6cf; margin-bottom:6px; }
.msg.ai{ color:#ffd3b6; margin-bottom:6px; }
#user-input{ flex:1; padding:8px; border-radius:6px; border:none; background:rgba(255,255,255,0.03); color:#fff; }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="panel">

<h2>Puter AI + TTS Pro</h2>

<!-- Legacy prompt (optional) -->
<textarea id="prompt" placeholder="Ask AI anything..."></textarea>

<div class="controls">
  <button id="sendPromptBtn">Send (Prompt)</button>
  <button id="toggleBtn">Start TTS</button>
  <button id="nextBtn">Next</button>
  <button id="prevBtn">Prev</button>
  <button onclick="prevWords(4)">Prev 4 Words</button>
  <button onclick="nextWords(4)">Next 4 Words</button>
  <button id="clearAllBtn">Clear</button>
</div>

<div class="controls">
  <label>Word Gap <input id="normalGap" type="number" value="400"></label>
  <label>Sentence Gap <input id="sentenceGap" type="number" value="1200"></label>
  <label>Repeat <input id="repeatCount" type="number" value="2"></label>
</div>

<!-- HISTORY CONTROLS -->
<div class="controls" style="margin-top:12px; align-items:center;">
  <label><input id="enableHistory" type="checkbox" checked> Save conversation history</label>
  <button id="clearHistoryBtn">Clear History</button>
  <span class="small">Stored messages: <span id="historyCount">0</span></span>
</div>

<!-- Structured chat UI -->
<div id="chat-ui" style="margin-top:12px;">
  <div id="chat-window"></div>
  <div style="display:flex; gap:8px; margin-top:8px;">
    <input id="user-input" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<div id="output">AI response appears here...</div>

<div style="margin-top:12px;">
  <button onclick="window.location.reload();">Refresh Page</button>
</div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>
// =======================
// CANVAS BACKGROUND
// =======================
history.pushState(null, document.title, location.href);
window.addEventListener('popstate', () => { window.location.reload(); history.pushState(null, document.title, location.href); });

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener("resize", resize);

const particles=[];
for(let i=0;i<120;i++){
  particles.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, dx:(Math.random()-.5)*1.5, dy:(Math.random()-.5)*1.5, r:Math.random()*3+1 });
}
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x+=p.dx; p.y+=p.dy;
    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle="white"; ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();

// =======================
// HISTORY (localStorage)
// =======================
const HISTORY_KEY = 'puter_history_v1';
let historyMessages = [];
const MAX_HISTORY_ENTRIES = 40;

function loadHistory(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    historyMessages = raw ? JSON.parse(raw) : [];
  }catch(e){ console.warn('Failed to load history', e); historyMessages = []; }
  updateHistoryCount();
}
function saveHistory(){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(historyMessages)); }catch(e){ console.warn('Failed to save history', e); }
}
function addToHistory(role, content){
  if(!content) return;
  historyMessages.push({role, content});
  if(historyMessages.length > MAX_HISTORY_ENTRIES) historyMessages = historyMessages.slice(-MAX_HISTORY_ENTRIES);
  saveHistory(); updateHistoryCount();
}
function clearHistory(){
  historyMessages = []; saveHistory(); updateHistoryCount();
  const output = document.getElementById('output'); output.textContent = "Conversation history cleared.";
}
function updateHistoryCount(){ const el = document.getElementById('historyCount'); if(el) el.innerText = historyMessages.length; }
loadHistory();

// =======================
// TTS PRO
// =======================
let sentences=[]; let currentSentenceIndex=0; let currentWordIndex=0; let repeat=0;
let stopFlag=true; let skip=false; let back=false;
let wordGap = +document.getElementById('normalGap')?.value || 400;
let repeatLimit = 1;
const toggleBtn = document.getElementById("toggleBtn");

function prepareTTS(text){
  sentences = text ? (text.match(/[^.!?]+[.!?]*/g) || [text]) : [];
  currentSentenceIndex=0; currentWordIndex=0; repeat=0;
}
function toggle(){ if(stopFlag) start(); else stop(); }
function start(){
  if(sentences.length===0) return;
  stopFlag=false; skip=false; back=false;
  wordGap = +document.getElementById("normalGap").value || 400;
  repeatLimit = +document.getElementById("repeatCount").value || 1;
  toggleBtn.innerText = "Stop TTS";
  speechSynthesis.cancel();
  run();
}
function run(){
  if(stopFlag) return;
  if(currentSentenceIndex<0) currentSentenceIndex=0;
  if(currentSentenceIndex>=sentences.length){ stop(); currentSentenceIndex=0; currentWordIndex=0; return; }
  let words = sentences[currentSentenceIndex].trim().split(/\s+/);
  if(currentWordIndex>=words.length){ currentWordIndex=0; currentSentenceIndex++; setTimeout(run,0); return; }

  function speakWord(){
    if(stopFlag) return;
    if(skip){ skip=false; repeat=0; currentSentenceIndex++; currentWordIndex=0; run(); return; }
    if(back){ back=false; repeat=0; currentSentenceIndex--; currentWordIndex=0; run(); return; }
    if(currentWordIndex>=words.length){
      repeat++;
      const sg = +document.getElementById("sentenceGap").value || 1200;
      if(repeat < repeatLimit){ setTimeout(()=>{ currentWordIndex=0; speakWord(); }, sg); }
      else { repeat=0; currentSentenceIndex++; currentWordIndex=0; setTimeout(run, sg); }
      return;
    }
    let utter = new SpeechSynthesisUtterance(words[currentWordIndex++]);
    utter.onend = ()=>{ setTimeout(speakWord, wordGap); };
    utter.onerror = ()=>{ setTimeout(speakWord, wordGap); };
    speechSynthesis.speak(utter);
  }

  speakWord();
}
function stop(){ stopFlag=true; speechSynthesis.cancel(); toggleBtn.innerText = "Start TTS"; }
function next(){ skip=true; speechSynthesis.cancel(); }
function prev(){ back=true; speechSynthesis.cancel(); }

function prevWords(n){
  if(typeof n !== 'number') n = 4;
  if(sentences.length===0) return;
  speechSynthesis.cancel();
  stopFlag=false;
  let remaining = n;
  let words = sentences[currentSentenceIndex] ? sentences[currentSentenceIndex].trim().split(/\s+/) : [];
  if(currentWordIndex - remaining >= 0){ currentWordIndex = Math.max(0, currentWordIndex - remaining); }
  else {
    remaining -= currentWordIndex;
    if(currentSentenceIndex > 0){
      currentSentenceIndex--;
      let prevWordsArr = sentences[currentSentenceIndex].trim().split(/\s+/);
      while(remaining > prevWordsArr.length && currentSentenceIndex > 0){
        remaining -= prevWordsArr.length;
        currentSentenceIndex--;
        prevWordsArr = sentences[currentSentenceIndex].trim().split(/\s+/);
      }
      currentWordIndex = Math.max(0, prevWordsArr.length - remaining);
    } else { currentWordIndex = 0; }
  }
  wordGap = +document.getElementById('normalGap').value || 400;
  repeatLimit = +document.getElementById('repeatCount').value || 1;
  toggleBtn.innerText = "Stop TTS";
  run();
}

function nextWords(n){
  if(typeof n !== 'number') n = 4;
  if(sentences.length === 0) return;
  speechSynthesis.cancel();
  stopFlag=false;
  let remaining = n;
  let i = currentSentenceIndex;
  let j = currentWordIndex;

  while(remaining > 0 && i < sentences.length){
    let arr = sentences[i] ? sentences[i].trim().split(/\s+/) : [];
    let available = arr.length - j;
    if(available > remaining){ j += remaining; remaining = 0; break; }
    else { remaining -= available; i++; j = 0; }
  }

  if(i >= sentences.length){
    currentSentenceIndex = Math.max(0, sentences.length - 1);
    currentWordIndex = sentences[currentSentenceIndex] ? sentences[currentSentenceIndex].trim().split(/\s+/).length : 0;
    stopFlag = true;
    toggleBtn.innerText = "Start TTS";
    return;
  }

  currentSentenceIndex = i;
  currentWordIndex = j;

  wordGap = +document.getElementById('normalGap').value || 400;
  repeatLimit = +document.getElementById('repeatCount').value || 1;
  toggleBtn.innerText = "Stop TTS";
  run();
}

function clearAll(){
  document.getElementById("prompt").value="";
  document.getElementById("output").textContent="";
  sentences=[];
  currentSentenceIndex=0; currentWordIndex=0;
  stop();
}

// =======================
// SHORTCUTS
// =======================
document.addEventListener("keydown", e=>{
  let k = e.key.toLowerCase();
  if(k==="k") next();
  if(k==="j") prev();
  if(k==="b"){
    stop();
      e.preventDefault();
      prevWords(4);
  }
  if(k==="f"){ // forward 4 words
      e.preventDefault();
      nextWords(4);
  }
  if(k===" "){
      e.preventDefault();
      if(speechSynthesis.paused){ speechSynthesis.resume(); } else { speechSynthesis.pause(); }
  }
  if(/^[0-9]$/.test(k)){
      wordGap = parseInt(k)*1000;
  }
});

// =======================
// Structured chat + streaming
// =======================
const chatWindow = document.getElementById('chat-window');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

function appendToChat(who, text, cls=''){
  const div = document.createElement('div');
  div.className = `msg ${cls}`;
  div.style.marginBottom = '6px';
  div.innerHTML = `<b>${who}:</b> ${escapeHtml(text)}`;
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return div;
}
function escapeHtml(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function handleSend(){
  const text = userInput.value.trim();
  if(!text) return;
  userInput.value = '';
  appendToChat('You', text, 'user');

  const enableHistory = document.getElementById('enableHistory')?.checked;
  const conversationHistory = [];

  if(enableHistory && Array.isArray(historyMessages) && historyMessages.length){
    historyMessages.forEach(m => conversationHistory.push({ role: m.role, content: m.content }));
  }
  conversationHistory.push({ role: 'user', content: text });

  // Show AI container that will be updated while streaming
  const aiContainer = document.createElement('div');
  aiContainer.className = 'msg ai';
  aiContainer.style.marginBottom = '6px';
  aiContainer.innerHTML = `<b>DeepSeek:</b> `;
  chatWindow.appendChild(aiContainer);
  chatWindow.scrollTop = chatWindow.scrollHeight;

  try {
    // The API here is called with a structured array. If your API expects a different shape (e.g., {messages: [...]})
    // replace puter.ai.chat(conversationHistory, {...}) with the expected call shape.
    const chat_resp = await puter.ai.chat(conversationHistory, { model: 'deepseek-v3.2', stream:true });

    let fullText = '';
    for await (const part of chat_resp){
      if(part?.text){
        fullText += part.text;
        aiContainer.innerHTML = `<b>DeepSeek:</b> ${escapeHtml(fullText)}`;
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
    }

    if(enableHistory){
      addToHistory('user', text);
      addToHistory('assistant', fullText);
    }

    // Also display in the output area and prepare TTS
    document.getElementById('output').textContent = fullText;
    prepareTTS(fullText);
    // Auto-start TTS when a reply is received:
    start();

  } catch (err){
    aiContainer.innerHTML += `<span style="color: red;"> Error: ${escapeHtml(err?.message || String(err))}</span>`;
  }
}

// Allow pressing Enter to send (without Shift)
sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

// =======================
// Legacy prompt -> combined/simpler send
// Keeps compatibility: uses text concatenation of history as fallback
// =======================
const sendPromptBtn = document.getElementById('sendPromptBtn');
const clearAllBtn = document.getElementById('clearAllBtn');
const nextButton = document.getElementById('nextBtn');
const prevButton = document.getElementById('prevBtn');
const clearHistoryBtn = document.getElementById('clearHistoryBtn');

sendPromptBtn.addEventListener('click', sendPrompt);
clearAllBtn.addEventListener('click', clearAll);
nextButton.addEventListener('click', next);
prevButton.addEventListener('click', prev);
clearHistoryBtn.addEventListener('click', () => { clearHistory(); chatWindow.innerHTML=''; });

async function sendPrompt(){
  const prompt = document.getElementById("prompt").value.trim();
  if(!prompt) return;
  const output = document.getElementById("output");
  output.textContent = "Thinking...";
  try{
    const enableHistory = document.getElementById('enableHistory')?.checked;
    let sendPromptText = prompt;
    if(enableHistory && historyMessages.length){
      const prefix = historyMessages.map(m=> (m.role==='user' ? 'User: ' : 'Assistant: ') + (m.content||'').replace(/\s+/g,' ').trim() ).join('\n');
      sendPromptText = prefix + "\nUser: " + prompt + "\nAssistant:";
    }

    const response = await puter.ai.chat(sendPromptText, { stream:true, model:"gpt-5.4-nano" });
    output.textContent = "";
    let assistantText = "";
    for await(const part of response){
      const text = part?.text || "";
      output.textContent += text;
      assistantText += text;
    }

    if(document.getElementById('enableHistory')?.checked){
      addToHistory('user', prompt);
      addToHistory('assistant', assistantText);
    }

    prepareTTS(assistantText);
    start();

  }catch(err){
    output.textContent = "Error: " + (err?.message || err);
  }
}

// =======================
// Misc / before unload
// =======================
window.addEventListener("beforeunload", e=>{ e.preventDefault(); e.returnValue=""; });
</script>

</body>
</html>
